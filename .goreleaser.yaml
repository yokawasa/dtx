version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dtx
    main: ./cmd/dtx
    binary: dtx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/yokawasa/dtx/internal/cli.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "dtx_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: yokawasa
    name: dtx
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
